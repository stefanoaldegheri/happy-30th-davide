<!DOCTYPE html>
<html>
<head>
    <title>Chess Position Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/chessboardjsx@2.4.7/dist/chessboardjsx.js"></script>
    <style>
        #board {
            width: 400px;
        }
    </style>
</head>
<body>
    <h1>Chess Position Test</h1>
    <div id="board"></div>
    <div id="fen"></div>
    <div id="ascii"></div>
    
    <script>
        // Initial position FEN from PRD
        const initialFen = '7r/8/4R3/3P1kP1/5p1p/q6P/1p2P1PP/4BNK1 w - - 0 1';
        
        document.getElementById('fen').innerHTML = '<p>FEN: ' + initialFen + '</p>';
        
        const chess = new Chess(initialFen);
        document.getElementById('ascii').innerHTML = '<pre>' + chess.ascii() + '</pre>';
        
        // Create chessboard
        ChessBoard('board', {
            position: initialFen,
            orientation: 'white'
        });
    </script>
</body>
</html>
